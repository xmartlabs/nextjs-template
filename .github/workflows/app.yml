name: "App build, lint and tests"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    env:
      - NEXT_PUBLIC_API_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Nodejs
        uses: actions/setup-node@v3
        with:
          node-version: 20.8.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run Linter
        run: npm run lint

      - name: Run Prettier
        run: npm run prettier:check

      - name: Run TSC
        run: npm run tsc

      - name: Run Stylelint
        run: npm run stylelint

      - name: Run tests
        run: npm test
