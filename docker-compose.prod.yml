version: "3.8"
services:
  app:
    container_name: nextjs-template-app
    image: nextjs-template-img
    build:
      context: ./
      args:
        NODE_ENV: production
        NODE_VERSION: ${NODE_VERSION:-20.9.0}
      dockerfile: Dockerfile
      target: prod-runner

    ports:
      - 8080:3000
    env_file:
      - .env.production.local
